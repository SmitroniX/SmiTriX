# Dependency updates, kept minimal for frontend npm packages and GitHub Actions.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ['*']
        update-types: ['minor', 'patch']
      frontend-major:
        patterns: ['*']
        update-types: ['major']
    ignore:
      - dependency-name: '@capacitor/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@capacitor-mlkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@aparajita/capacitor-secure-storage'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
      actions-major:
        patterns: ['*']
        update-types: ['major']
