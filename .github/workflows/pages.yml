# Publishes the SmiTriX website and live demo to GitHub Pages: https://smitronix.github.io/SmiTriX/
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build live demo
        working-directory: frontend
        env:
          VITE_DEMO: '1'
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Stage website with latest demo
        run: |
          rm -rf website/demo
          cp -r frontend/dist website/demo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
