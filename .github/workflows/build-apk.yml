name: Build & Release Android APK

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft release if triggered manually without a tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Sign APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Frontend Dependencies & Build Mobile Bundle
        run: |
          cd frontend
          npm ci
          npm run build:mobile
          APP_VER=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$APP_VER" >> $GITHUB_ENV
          echo "Building SmiTriX mobile v$APP_VER"

      - name: Make Gradlew Executable
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Android Release APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign & Align APK
        run: |
          set -eu
          UNSIGNED="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            echo "ERROR: Could not find unsigned apk at $UNSIGNED"
            find frontend/android/app/build/outputs/apk -type f
            exit 1
          fi

          if [ -d "${ANDROID_HOME:-}/build-tools" ]; then
            BT="$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -1)"
            ZIPALIGN="${BT}/zipalign"
            APKSIGNER="${BT}/apksigner"
          fi
          if [ ! -x "${ZIPALIGN:-}" ]; then
            ZIPALIGN="$(which zipalign 2>/dev/null || true)"
          fi
          if [ ! -x "${APKSIGNER:-}" ]; then
            APKSIGNER="$(which apksigner 2>/dev/null || true)"
          fi

          echo "Using Android Build Tools: ${BT:-PATH}"

          # 1. Zipalign the unsigned APK
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "aligned.apk"

          # 2. Check if user configured secret keystore, else use persistent repository release keystore
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing with provided ANDROID_KEYSTORE_BASE64 secret..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            KEYSTORE="release.keystore"
            KS_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          elif [ -f "frontend/android/smitrix-release.keystore" ]; then
            echo "Using persistent repository release keystore..."
            KEYSTORE="frontend/android/smitrix-release.keystore"
            KS_PASS="smitrix_release_key"
            KEY_ALIAS="smitrix"
          else
            echo "Generating fallback release signing key..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias smitrix \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "smitrix_release_key" \
              -keypass "smitrix_release_key" \
              -dname "CN=SmiTriX, OU=Mobile, O=SmitroniX, L=Mumbai, ST=Maharashtra, C=IN"
            KEYSTORE="release.keystore"
            KS_PASS="smitrix_release_key"
            KEY_ALIAS="smitrix"
          fi

          # 3. Sign the APK
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KS_PASS" \
            --out "SmiTriX-${APP_VERSION}.apk" \
            aligned.apk

          # 4. Verify signature
          "$APKSIGNER" verify --verbose --print-certs "SmiTriX-${APP_VERSION}.apk"

          # 5. Checksums and generic named copy for direct download links
          sha256sum "SmiTriX-${APP_VERSION}.apk" > "SmiTriX-${APP_VERSION}.apk.sha256"
          cp "SmiTriX-${APP_VERSION}.apk" "SmiTriX.apk"
          sha256sum "SmiTriX.apk" > "SmiTriX.apk.sha256"
          APK_HASH=$(cut -d' ' -f1 "SmiTriX.apk.sha256")
          echo "APK_SHA256=$APK_HASH" >> $GITHUB_ENV

          # Cleanup temporary build files from runner
          rm -f release.keystore aligned.apk

          echo "Signed APK successfully created: SmiTriX-${APP_VERSION}.apk (SHA-256: $APK_HASH)"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: smitrix-android-apk
          path: |
            SmiTriX-*.apk
            SmiTriX-*.apk.sha256
            SmiTriX.apk
            SmiTriX.apk.sha256
          retention-days: 30

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: SmiTriX v${{ env.APP_VERSION }}
          body: |
            ### Downloads
            - **Signed APK**: [SmiTriX.apk](https://github.com/SmitroniX/SmiTriX/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}/SmiTriX.apk)
            - **Versioned APK**: [SmiTriX-${{ env.APP_VERSION }}.apk](https://github.com/SmitroniX/SmiTriX/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION) }}/SmiTriX-${{ env.APP_VERSION }}.apk)
            - **SHA-256 Checksum**: `${{ env.APK_SHA256 }}`
          files: |
            SmiTriX-${{ env.APP_VERSION }}.apk
            SmiTriX-${{ env.APP_VERSION }}.apk.sha256
            SmiTriX.apk
            SmiTriX.apk.sha256
          generate_release_notes: true
