name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Configure Android signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/smitrix-release.keystore
            cat > android/key.properties <<EOF
          storePassword=${STORE_PASS:-smitrix_release_key}
          keyPassword=${KEY_PASS:-smitrix_release_key}
          keyAlias=${KEY_ALIAS:-smitrix}
          storeFile=smitrix-release.keystore
          EOF
          elif [ -f android/app/smitrix-release.keystore ]; then
            cat > android/key.properties <<EOF
          storePassword=smitrix_release_key
          keyPassword=smitrix_release_key
          keyAlias=smitrix
          storeFile=smitrix-release.keystore
          EOF
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build signed universal Android APK
        env:
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          mkdir -p dist
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk dist/SmiTriX.apk

      - name: Build signed ABI-split Android APKs
        env:
          FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"

      - name: Package release APKs & SHA-256 checksums
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          fi
          cp dist/SmiTriX.apk "dist/SmiTriX-${VERSION}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              cp "$src" "dist/SmiTriX-${VERSION}-${abi}.apk"
            fi
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          (cd dist && sha256sum SmiTriX.apk > SmiTriX.apk.sha256)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smitrix-android-apk
          path: dist/*

      - name: Publish APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          name: SmiTriX ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/SmiTriX.apk.sha256
