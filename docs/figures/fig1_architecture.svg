<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="grad_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="grad_purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="grad_amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">SmiTriX High-Level Containerized &amp; Local-First Architecture</text>
  <text x="450" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Zero-Telemetry, Self-Hosted Docker Topology &amp; Standalone Client Integration</text>

  <!-- Section 1: Client Layer -->
  <rect x="30" y="80" width="220" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="80" width="220" height="36" rx="10" fill="url(#grad_blue)"/>
  <text x="140" y="104" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Client Layer (User Devices)</text>

  <!-- Client items -->
  <rect x="45" y="130" width="190" height="75" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="140" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">PWA Client (Browser)</text>
  <text x="140" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">React 19 + Vite + Zustand</text>
  <text x="140" y="185" font-family="system-ui, sans-serif" font-size="9.5" fill="#2563eb" text-anchor="middle">WebAuthn / Passkey Biometrics</text>

  <rect x="45" y="215" width="190" height="75" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="140" y="237" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Standalone Android APK</text>
  <text x="140" y="255" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Capacitor Native Shell</text>
  <text x="140" y="270" font-family="system-ui, sans-serif" font-size="9.5" fill="#059669" text-anchor="middle">Local Storage &amp; Workouts Backup</text>

  <rect x="45" y="300" width="190" height="85" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="140" y="322" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">External LLM Clients</text>
  <text x="140" y="340" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Claude Desktop / Cursor / Cline</text>
  <text x="140" y="355" font-family="system-ui, sans-serif" font-size="9.5" fill="#7c3aed" text-anchor="middle">Model Context Protocol (MCP)</text>
  <text x="140" y="370" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Local Stdio Bridge (Zero Cloud)</text>

  <rect x="45" y="395" width="190" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="140" y="418" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Client State Engine</text>
  <text x="140" y="435" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155" text-anchor="middle">Zustand: `gym_state_v1`</text>
  <text x="140" y="450" font-family="system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Progression &amp; 1RM Pure Libs</text>

  <!-- Connectors from Client to Web/Host -->
  <line x1="235" y1="167" x2="310" y2="167" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="272" y="158" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">HTTPS / 8080</text>

  <line x1="235" y1="342" x2="610" y2="445" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="380" y="375" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#7c3aed" text-anchor="middle">Local Stdio Spawn</text>

  <!-- Section 2: Docker Environment (Web & API) -->
  <rect x="310" y="80" width="270" height="400" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="5,5" filter="url(#shadow)"/>
  <rect x="310" y="80" width="270" height="36" rx="10" fill="url(#grad_blue)"/>
  <text x="445" y="104" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Docker Compose Stack</text>

  <!-- Web Container (Nginx) -->
  <rect x="325" y="130" width="240" height="110" rx="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="445" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Container 1: `web` (Nginx Alpine)</text>
  <text x="445" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Serves Static PWA Assets (HTML/CSS/JS)</text>
  <text x="445" y="186" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Single Origin Proxy: `/api` → `api:3000`</text>
  <text x="445" y="202" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Serves Shared Exercise Media Volume</text>
  <text x="445" y="222" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0284c7" text-anchor="middle">Mandatory for WebAuthn RP_ID Origin Match</text>

  <line x1="445" y1="240" x2="445" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="475" y="263" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Internal Net</text>

  <!-- API Container -->
  <rect x="325" y="280" width="240" height="185" rx="8" fill="#f8fafc" stroke="#10b981" stroke-width="1.2"/>
  <text x="445" y="302" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#065f46" text-anchor="middle">Container 2: `api` (Node 22 LTS)</text>
  <text x="445" y="320" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Zero-Framework Native HTTP Server</text>
  <text x="445" y="336" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• WebAuthn FIDO2 Biometric Engine</text>
  <text x="445" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• HMAC-SHA256 Signed Session Cookies</text>
  <text x="445" y="368" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Web Push Dispatch (VAPID Keys)</text>
  <text x="445" y="384" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• AI Coach Allowlist Execution Gateway</text>
  <text x="445" y="400" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Atomic File Writes (`atomicWrite`)</text>
  <rect x="335" y="415" width="220" height="40" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="445" y="432" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#14532d" text-anchor="middle">Strict Privilege Isolation &amp; Security</text>
  <text x="445" y="446" font-family="system-ui, sans-serif" font-size="8.5" fill="#166534" text-anchor="middle">Custom DNS Resolver Prevents SSRF Exploits</text>

  <!-- Section 3: Storage & Local Host Services -->
  <rect x="610" y="80" width="260" height="400" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="610" y="80" width="260" height="36" rx="10" fill="url(#grad_amber)"/>
  <text x="740" y="104" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Host Data &amp; Integrations</text>

  <!-- Flat file DB box -->
  <rect x="625" y="130" width="230" height="150" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="740" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle">Atomic JSON Storage (`./data`)</text>
  <text x="640" y="172" font-family="Courier, monospace" font-size="9.5" fill="#78350f">db.json (Users, Credentials)</text>
  <text x="640" y="188" font-family="Courier, monospace" font-size="9.5" fill="#78350f">state-&lt;uid&gt;.json (Workouts, 1RM)</text>
  <text x="640" y="204" font-family="Courier, monospace" font-size="9.5" fill="#78350f">secret (HMAC Session Token Key)</text>
  <text x="640" y="220" font-family="Courier, monospace" font-size="9.5" fill="#78350f">vapid.json (Web Push Keypair)</text>
  <text x="640" y="236" font-family="Courier, monospace" font-size="9.5" fill="#78350f">audit.log (Sign-in Activity)</text>
  <rect x="635" y="248" width="210" height="24" rx="4" fill="#fef3c7"/>
  <text x="740" y="264" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#b45309" text-anchor="middle">File Permissions: Mode 0o600</text>

  <!-- Media box -->
  <rect x="625" y="295" width="230" height="95" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="740" y="317" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Exercise Media Storage (`media`)</text>
  <text x="740" y="335" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">One-Shot Downloader Container</text>
  <text x="740" y="350" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">1,324 GIFs &amp; High-Res Diagrams</text>
  <text x="740" y="365" font-family="system-ui, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">Zero Copyright Redistribution Policy</text>
  <text x="740" y="378" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Upstream ExerciseDB v1 Fetch</text>

  <!-- MCP Bridge Box -->
  <rect x="625" y="405" width="230" height="65" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <text x="740" y="425" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#581c87" text-anchor="middle">Model Context Protocol Server</text>
  <text x="740" y="442" font-family="system-ui, sans-serif" font-size="9.5" fill="#6b21a8" text-anchor="middle">Direct Read-Only POSIX Stdio Access</text>
  <text x="740" y="457" font-family="system-ui, sans-serif" font-size="8.5" fill="#7e22ce" text-anchor="middle">Pure Shared Functions (`onerm.js`, `history.js`)</text>

  <!-- API to Data line -->
  <line x1="565" y1="365" x2="625" y2="205" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="185" x2="625" y2="340" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
</svg>