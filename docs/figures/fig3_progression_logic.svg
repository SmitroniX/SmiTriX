<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="m-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="m-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
  </defs>

  <rect width="850" height="480" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="425" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">SmiTriX Adaptive Progression Engine Decision Logic</text>
  <text x="425" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">State Transition Flow: Session Readback → Rule Evaluation → Next Workout Target Formulation</text>

  <!-- Start State: Session Completed -->
  <rect x="330" y="70" width="190" height="45" rx="8" fill="#1e3a8a" filter="url(#shadow3)"/>
  <text x="425" y="93" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Completed Workout Logged</text>
  <text x="425" y="106" font-family="system-ui, sans-serif" font-size="9" fill="#93c5fd" text-anchor="middle">Filter Out Warmup Sets (!isWarmupRow)</text>

  <line x1="425" y1="115" x2="425" y2="150" stroke="#334155" stroke-width="1.8" marker-end="url(#m-arrow)"/>

  <!-- Decision: Policy Identification -->
  <polygon points="425,150 540,190 425,230 310,190" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="425" y="186" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">Identify Active Policy</text>
  <text x="425" y="199" font-family="system-ui, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">Linear | Greyskull | Double | Time</text>

  <!-- Branch 1: Linear LP -->
  <line x1="310" y1="190" x2="160" y2="260" stroke="#334155" stroke-width="1.8" marker-end="url(#m-arrow)"/>
  <text x="210" y="215" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1e3a8a">Linear Progression</text>

  <rect x="70" y="260" width="180" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow3)"/>
  <text x="160" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Evaluate Rep Target</text>
  <text x="160" y="296" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Did all work sets hit reps &gt;= goal?</text>
  <text x="160" y="315" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">YES: Weight += Increment</text>
  <text x="160" y="330" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">NO: Increment stallCount</text>

  <!-- Branch 2: Greyskull LP -->
  <line x1="425" y1="230" x2="425" y2="260" stroke="#334155" stroke-width="1.8" marker-end="url(#m-arrow)"/>
  <text x="430" y="248" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7c3aed">Greyskull LP</text>

  <rect x="330" y="260" width="190" height="95" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2" filter="url(#shadow3)"/>
  <text x="425" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#581c87" text-anchor="middle">Inspect Final AMRAP Set</text>
  <text x="425" y="295" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Target Reps: R. Final Set Reps: A</text>
  <text x="425" y="312" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">A &gt;= 2*R: Double Jump (+2*Inc)</text>
  <text x="425" y="327" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">A &gt;= R: Single Jump (+Inc)</text>
  <text x="425" y="342" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">A &lt; R: Immediate 10% Deload!</text>

  <!-- Branch 3: Double Progression -->
  <line x1="540" y1="190" x2="690" y2="260" stroke="#334155" stroke-width="1.8" marker-end="url(#m-arrow)"/>
  <text x="640" y="215" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0284c7">Double Progression</text>

  <rect x="600" y="260" width="180" height="80" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow3)"/>
  <text x="690" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Rep Range Traversal</text>
  <text x="690" y="296" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">e.g., [min: 8, max: 12]</text>
  <text x="690" y="315" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">All sets hit max (12): Load↑, Reps→8</text>
  <text x="690" y="330" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">Within range: Hold weight, advance reps</text>

  <!-- Deload Handling -->
  <line x1="160" y1="340" x2="250" y2="390" stroke="#dc2626" stroke-width="1.8" marker-end="url(#m-arrow-red)"/>
  <line x1="425" y1="355" x2="425" y2="390" stroke="#dc2626" stroke-width="1.8" marker-end="url(#m-arrow-red)"/>
  <line x1="690" y1="340" x2="600" y2="390" stroke="#dc2626" stroke-width="1.8" marker-end="url(#m-arrow-red)"/>

  <rect x="250" y="390" width="350" height="65" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="425" y="412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b" text-anchor="middle">Stall Condition Triggered (Deload Threshold Met)</text>
  <text x="425" y="428" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">stallCount &gt;= DELOAD_AFTER (Linear=3, Greyskull=1, Double=3)</text>
  <text x="425" y="443" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">New Target Weight = Math.round(weight * 0.9 / inc) * inc (10% Reset)</text>
</svg>